# Lint scope for Frontier Bench.
#
# coordinator.py and worker.py under environment/starter/ are the
# intentionally-incomplete skeleton handed to the agent under test (they
# contain scaffolding imports and NotImplementedError stubs by design), so
# only those two are excluded. The rest of environment/starter/ (constants,
# models, journal, the scheduler CLI, store, and the harness) is fully
# provided, unstubbed code and is linted like everything else.
extend-exclude = [
    "environment/starter/scheduler/coordinator.py",
    "environment/starter/scheduler/worker.py",
]

[lint]
# Keep the ruleset to the pragmatic core CONTRIBUTING.md describes (PEP 8 +
# pyflakes + import sorting) rather than ruff's full opinionated add-on set.
select = ["E4", "E7", "E9", "F", "I"]
